model:
  target: models.uni_controlnet.UniControlNet
  params:
    #parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "jpg"
    cond_stage_key: "txt"
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    mode: global
    
    global_control_config:
      target: models.global_adapter.GlobalAdapter
      params:
        in_dim: 1024
        channel_mult: [2, 8]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: True
        use_fp16: False
        image_size: 32
        in_channels: 4
        model_channels: 320
        out_channels: 4
        num_res_blocks: 2
        attention_resolutions: [4, 2, 1]
        channel_mult: [1, 2, 4, 4]
        #num_heads: 8
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenOpenCLIPEmbedder
      params:
        freeze: True
        layer: "penultimate"
        
data:
  target: src.train.dataset.UniDataset
  params:
    anno_path: ./data_THINGSEEG/anno.txt
    image_dir: ./data_THINGSEEG/images
    condition_root: ./data_THINGSEEG/conditions
    local_type_list: []
    global_type_list: [eeg]
    resolution: 256
    drop_txt_prob: 0.5
    keep_all_cond_prob: 0.1
    drop_all_cond_prob: 0.1
    drop_each_cond_prob: [0.0]

data_val:
  target: src.train.dataset.UniDataset
  params:
    image_dir: ./data_THINGSEEG/images/validation
    condition_root: ./data_THINGSEEG/conditions/validation
    local_type_list: []
    global_type_list: [eeg]
    resolution: 256